<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার GitHub Pages সাইট</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .success {
            background: #4ade80;
            color: #1f2937;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
        a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 সাইট লাইভ হয়েছে!</h1>
        <p>আপনার GitHub Pages সাইট সফলভাবে প্রকাশিত হয়েছে।</p>
        <p>এটি একটি নমুনা ওয়েবপেজ। আপনি চাইলে এই HTML ফাইলটি এডিট করে নিজের কন্টেন্ট দিতে পারেন।</p>
        <div class="success">✅ https://andkpk.github.io</div>
        <p style="margin-top: 30px;">
            🔧 পরিবর্তন করতে চাইলে এই <strong>index.html</strong> ফাইলটি এডিট করুন এবং আবার পুশ করুন।
        </p>
        <p>📖 <a href="https://docs.github.com/en/pages" target="_blank">GitHub Pages ডকুমেন্টেশন</a></p>
    </div>
</body>
</html>
